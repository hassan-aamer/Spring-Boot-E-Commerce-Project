version: '3.8'

services:
  mysqldb:
    image: mysql:8.0
    container_name: ecommerce-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: e_commerce_db
      MYSQL_USER: ecommerce_user
      MYSQL_PASSWORD: ecommerce_pass
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: ecommerce-app
    ports:
      - "8085:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysqldb:3306/e_commerce_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ecommerce_user
      SPRING_DATASOURCE_PASSWORD: ecommerce_pass
    depends_on:
      mysqldb:
        condition: service_healthy

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: ecommerce-phpmyadmin
    environment:
      PMA_HOST: mysqldb
      PMA_PORT: 3306
    ports:
      - "8086:80"
    depends_on:
      mysqldb:
        condition: service_healthy

volumes:
  mysql_data:
